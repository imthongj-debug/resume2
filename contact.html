<nav class="nav">

    <a href="index.html" class="nav-logo">จิรภัทร อิ่มทอง</a>

    </div>

<main>

  <div class="page-header">
    <h1>ติดต่อ</h1>
    <p>ยินดีรับฟังทุกโอกาสในการร่วมงาน</p>
  </div>

  <div class="contact-grid">

    <div class="card" style="margin-bottom: 0;">
      <div class="sec-head">
        <span class="icon">📬</span>
        <h2>ช่องทางการติดต่อ</h2>
        <div class="bar"></div>
      </div>
      <div class="contact-items">
        <div class="contact-item">
          <div class="contact-icon">✉️</div>
          <div class="contact-info">
            <label>อีเมล</label>
            <a href="mailto:imthong_j@su.ac.th">imthong_j@su.ac.th</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">📱</div>
          <div class="contact-info">
            <label>โทรศัพท์</label>
            <a href="tel:+66834941176">083-494-1176</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">🐙</div>
          <div class="contact-info">
            <label>GitHub</label>
            <a href="https://github.com/imthongj-debug" target="_blank" rel="noopener">github.com/imthongj-debug</a>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 0;">
      <div class="sec-head">
        <span class="icon">💬</span>
        <h2>ส่งข้อความถึงผม</h2>
        <div class="bar"></div>
      </div>
      <form action="https://formspree.io/f/YOURID" method="POST">
        <div class="form-field">
          <label for="name">ชื่อของคุณ</label>
          <input type="text" id="name" name="name" placeholder="ชื่อ-นามสกุล" required>
        </div>
        <div class="form-field">
          <label for="email">อีเมลของคุณ</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>
        <div class="form-field">
          <label for="message">ข้อความ</label>
          <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความที่นี่..." required></textarea>
        </div>
        <button type="submit" class="btn-accent">ส่งข้อความ →</button>
      </form>
    </div>

  </div>

</main>
